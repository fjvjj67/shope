    <div class="hint ${msg&&msg.bad?'bad':''}" id="authmsg" ${msg?'':'hidden'}>${msg?esc(msg.t):''}</div>
    <button class="btn" type="submit">${mode==='up'?'إنشاء الحساب':'دخول'}</button>
    <button class="btn ghost" type="button" id="authsw">${mode==='up'?'لديّ حساب، تسجيل الدخول':'موظف جديد؟ إنشاء حساب'}</button>
  </form>`;
  document.getElementById('authsw').onclick=()=>authScreen(null,mode==='up'?'in':'up');
  document.getElementById('authf').onsubmit=async e=>{
    e.preventDefault();const f=e.target,email=f.email.value.trim(),pw=f.pw.value,m=document.getElementById('authmsg');
    const show=(t,bad)=>{m.hidden=false;m.className='hint'+(bad?' bad':'');m.textContent=t};
    if(!email||pw.length<8){show('اكتب البريد وكلمة مرور من ٨ أحرف على الأقل',true);return}
    f.querySelector('[type=submit]').disabled=true;
    try{
      if(mode==='up'){
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name:f.name.value.trim()},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;

      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
      }

    }catch(x){show(/Invalid login/i.test(x.message)?'البريد أو كلمة المرور غير صحيحة':/confirm/i.test(x.message)?'أكّد بريدك الإلكتروني أولاً من الرسالة المرسلة إليك':'تعذر الدخول: '+x.message,true)}

  };
}

/* ---------- data layer ---------- */
const COLS=['factories','orders','payments','carriers','shipments'];

}

async function put(col,obj,opts){
  opts=opts||{};if(!ADMIN&&ADMIN_COLS.includes(col)){toast('هذا الإجراء للمدير فقط','bad');throw new Error('admin_only')}

/* ---------- business logic ---------- */
const STAGES=[['production','قيد التصنيع'],['ready','جاهز للشحن'],['shipped','تم الشحن'],['received','مستلم']];
const STAGE_K={production:'info',ready:'warn',shipped:'info',received:'ok'};
const stageName=s=>(STAGES.find(x=>x[0]===s)||[0,'—'])[1];
const SHIP_ST=[['preparing','قيد التجهيز'],['transit','بالطريق'],['arrived','وصلت']];
const SHIP_K={preparing:'warn',transit:'info',arrived:'ok'};
const shipName=s=>(SHIP_ST.find(x=>x[0]===s)||[0,'—'])[1];
const r2=n=>Math.round(((+n||0)+Number.EPSILON)*100)/100;
const itemsTotal=o=>r2((o.items||[]).reduce((a,i)=>a+r2((+i.qty||0)*(+i.price||0)),0));
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
const ordName=n=>'الدفعة '+(ORD[n-1]||('رقم '+n));
const payKey=p=>(p.dueDate||p.paidDate||'9999-12-31');
function orderedPays(orderId,excludeId){
  return S.payments.filter(p=>p.orderId===orderId&&p.id!==excludeId).sort((a,b)=>payKey(a).localeCompare(payKey(b))||((a.createdAt||0)-(b.createdAt||0)));
}
/* ordered payment plan of an order: each payment with its number, running total and what is left after it */
function payPlan(o,excludeId){
  const total=itemsTotal(o);let cum=0;
  return orderedPays(o.id,excludeId).map((p,i)=>{cum=r2(cum+(+p.amount||0));return {p,n:i+1,cum,after:r2(total-cum)}});
}
function oi(o){
  const total=itemsTotal(o);
  const pays=S.payments.filter(p=>p.orderId===o.id);
  const paid=r2(pays.filter(p=>p.paid).reduce((a,p)=>a+(+p.amount||0),0));
  const scheduled=r2(pays.filter(p=>!p.paid).reduce((a,p)=>a+(+p.amount||0),0));
  const remaining=r2(Math.max(total-paid,0));
  const unscheduled=r2(Math.max(total-paid-scheduled,0));
  const unpaid=pays.filter(p=>!p.paid);
  const lateP=unpaid.some(p=>p.dueDate&&diffDays(p.dueDate)<0);
  let pay;
  if(!total)pay=['mute','بدون بنود'];else if(remaining<=0.001)pay=['ok','مدفوع'];else if(lateP)pay=['bad','متأخرة'];else if(paid>0)pay=['warn','جزئي'];else pay=['info','مستحق'];
  const done=['ready','shipped','received'].includes(o.stage);
  let timing=null;
  if(!done&&o.prepDate){const d=diffDays(o.prepDate);timing=d<0?{k:'bad',t:'متأخر '+plural(-d)}:d<=7?{k:'warn',t:d===0?'اليوم':'بعد '+plural(d)}:{k:'ok',t:'في الموعد'}}
  return {total,paid,scheduled,unscheduled,remaining,pay,timing,pays};
}
const factoryName=id=>{const f=byId('factories',id);return f?f.name:'—'};
const orderLabel=o=>o?(o.ref||'بدون رقم')+' · '+factoryName(o.factoryId):'—';
const shipRemaining=s=>r2(Math.max((+s.cost||0)-(+s.paidAmount||0),0));

const fld=(label,html,cls)=>`<label class="fld ${cls||''}"><span>${label}</span>${html}</label>`;

function importItemsFile(file){
  if(!window.XLSX){toast('مكتبة Excel غير محمّلة','bad');return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(r.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(x=>x.some(c=>String(c).trim()!==''));
      if(!rows.length){toast('الملف فارغ','bad');return}
      const head=rows[0].map(c=>String(c).toLowerCase());
      const find=(re,fb)=>{const i=head.findIndex(h=>re.test(h));return i>=0?i:fb};
      const iN=find(/اسم|منتج|صنف|بيان|name|product|item|desc/,0),iQ=find(/كمي|عدد|qty|quant|pcs/,1),iP=find(/سعر|price|unit/,2);
      const hasHead=head.some(h=>/اسم|منتج|صنف|بيان|كمي|عدد|سعر|name|product|item|qty|price/.test(h));
      const data=(hasHead?rows.slice(1):rows).map(x=>({name:String(x[iN]||'').trim(),qty:parseFloat(x[iQ])||0,price:parseFloat(x[iP])||0})).filter(i=>i.name);
      if(!data.length){toast('لم أجد بنوداً في الملف','bad');return}
      const box=$('#items');const only=box.querySelectorAll('.irow');
      if(only.length===1&&!readItems().length)box.innerHTML='';
      data.forEach(i=>box.insertAdjacentHTML('beforeend',itemRow(i)));
      updItemsTotal();toast('تم استيراد '+data.length+' بند');
    }catch(e){toast('تعذر قراءة الملف','bad')}
  };
  r.readAsArrayBuffer(file);
}

async function doDelete(col,id){

    if(col==='orders'){
      const np=S.payments.filter(p=>p.orderId===id).length;

    return `<div class="bar">${pill(STAGE_K[o.stage],stageName(o.stage))}${i.timing?pill(i.timing.k,'التجهيز: '+i.timing.t):''}${pill(i.pay[0],'الدفع: '+i.pay[1])}<span style="color:var(--mute)">${esc(factoryName(o.factoryId))} · ${fmtD(o.orderDate)}</span></div>
    <div class="kv"><div><small>الإجمالي</small><b>${money(i.total,o.currency)}</b></div><div><small>المدفوع</small><b>${money(i.paid,o.currency)}</b></div><div><small>المتبقي للمصنع</small><b>${money(i.remaining,o.currency)}</b></div><div><small>مجدول غير مدفوع</small><b>${money(i.scheduled,o.currency)}</b></div><div><small>غير مجدول</small><b>${money(i.unscheduled,o.currency)}</b></div><div><small>موعد التجهيز</small><b>${fmtD(o.prepDate)}</b></div></div>
    <div><div class="prog" role="img" aria-label="نسبة المدفوع ${Math.round(pp)} بالمئة"><i class="p1" style="width:${pp}%"></i><i class="p2" style="width:${ps}%"></i></div><div class="legend" style="margin-top:6px"><span><b style="background:var(--ok)"></b>مدفوع <bdi>${Math.round(pp)}%</bdi></span><span><b style="background:var(--warn)"></b>مجدول <bdi>${Math.round(ps)}%</bdi></span><span><b style="background:var(--glass-2)"></b>غير مجدول</span></div></div>
    ${items?`<div class="scroll"><table class="tbl"><thead><tr><th>المنتج</th><th class="n">الكمية</th><th class="n">السعر</th><th class="n">الإجمالي</th></tr></thead><tbody>${items}</tbody></table></div>`:''}
    <div><h3 style="margin-bottom:6px">الدفعات <button class="btn ghost sm" data-act="new-payment" data-order="${id}">${ico('plus',14)} دفعة</button></h3><ul class="list">${pays||'<li style="color:var(--mute)">لا توجد دفعات مسجّلة</li>'}</ul></div>
    <div><h3 style="margin-bottom:6px">الشحنات <button class="btn ghost sm" data-act="new-shipment" data-order="${id}">${ico('plus',14)} شحنة</button></h3><ul class="list">${ships||'<li style="color:var(--mute)">لا توجد شحنات مرتبطة</li>'}</ul></div>
    ${o.note?`<div class="hint">${esc(o.note)}</div>`:''}
    <div class="mf"><button class="btn ghost" type="button" data-act="del-ask" data-col="orders" data-id="${id}">${ico('trash',16)} حذف</button>${NEXT[o.stage]?`<button class="btn ghost" type="button" data-act="next-stage" data-id="${id}">${ico('check',16)} ${NEXT[o.stage][1]}</button>`:''}<button class="btn" type="button" data-act="edit-order" data-id="${id}">${ico('edit',16)} تعديل الطلب</button></div>`;
  };
  const mount=()=>{
    const o=byId('orders',id);if(!o)return;
    openModal('طلب '+(o.ref||''),draw(),{wide:true,refresh:()=>{const f=$('#mform');if(f){const h=draw();if(h)f.innerHTML=h}}});
  };
  mount();
}

const FL={orders:{q:'',st:''},payments:{q:'',st:''},shipments:{q:'',st:''}};
const toolbar=(key,opts)=>`<div class="bar card" style="padding:12px"><div class="grow field-s"><input id="q_${key}" type="search" placeholder="بحث سريع…" value="${esc(FL[key].q)}" aria-label="بحث"></div><select id="s_${key}" aria-label="تصفية" style="max-width:200px">${opts.map(o=>`<option value="${o[0]}"${FL[key].st===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div><div class="card scroll" id="list"></div>`;
const empty=(t,s,cta)=>`<div class="empty"><b>${t}</b><span>${s}</span>${cta||''}</div>`;

function ordersList(){
  const q=FL.orders.q.trim().toLowerCase(),st=FL.orders.st;
  let rows=S.orders.map(o=>({o,i:oi(o)})).filter(r=>{
    if(st==='open'&&r.o.stage==='received')return false;
    if(st==='late'&&!(r.i.timing&&r.i.timing.k==='bad'))return false;
    if(st==='unpaid'&&r.i.remaining<=0.001)return false;
    if(['production','ready','shipped','received'].includes(st)&&r.o.stage!==st)return false;
    if(q){const hay=(r.o.ref+' '+factoryName(r.o.factoryId)+' '+(r.o.note||'')+' '+(r.o.items||[]).map(x=>x.name).join(' ')).toLowerCase();if(!hay.includes(q))return false}
    return true}).sort((a,b)=>(b.o.orderDate||'').localeCompare(a.o.orderDate||''));
  if(!S.orders.length)return empty('لا توجد طلبات بعد','سجّل أول طلب مع المصنع وبنوده ومواعيده.',`<button class="btn" data-act="new-order">${ico('plus')} طلب جديد</button>`);
  if(!rows.length)return empty('لا نتائج','غيّر البحث أو التصفية.');
  return `<table class="tbl"><thead><tr><th>الطلب</th><th class="n">الإجمالي</th><th class="n">المدفوع</th><th class="n">المتبقي</th><th>الدفع</th><th>التجهيز</th><th>المرحلة</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" tabindex="0" data-act="open-order" data-id="${r.o.id}"><td data-label="الطلب"><b>${esc(r.o.ref)}</b><br><small style="color:var(--mute)">${esc(factoryName(r.o.factoryId))}</small></td><td class="n" data-label="الإجمالي">${money(r.i.total,r.o.currency)}</td><td class="n" data-label="المدفوع"><div class="cellv">${money(r.i.paid,r.o.currency)}<div class="prog" style="margin-top:4px"><i class="p1" style="width:${r.i.total?Math.min(100,r.i.paid/r.i.total*100):0}%"></i><i class="p2" style="width:${r.i.total?Math.min(100-Math.min(100,r.i.paid/r.i.total*100),r.i.scheduled/r.i.total*100):0}%"></i></div></div></td><td class="n" data-label="المتبقي">${money(r.i.remaining,r.o.currency)}</td><td data-label="الدفع">${pill(r.i.pay[0],r.i.pay[1])}</td><td data-label="التجهيز">${r.i.timing?pill(r.i.timing.k,r.i.timing.t)+'<br><small style="color:var(--mute)">'+fmtD(r.o.prepDate)+'</small>':'<span style="color:var(--mute)">'+fmtD(r.o.prepDate)+'</span>'}</td><td data-label="المرحلة">${pill(STAGE_K[r.o.stage],stageName(r.o.stage))}</td></tr>`).join('')}</tbody></table>`;
}
function payStatus(p){
  if(p.paid)return ['ok','مدفوعة'];
  if(!p.dueDate)return ['mute','بدون موعد'];
  const d=diffDays(p.dueDate);return d<0?['bad','متأخرة']:d<=7?['warn','قريبة']:['info','مجدولة'];
}
function paymentsList(){
  const q=FL.payments.q.trim().toLowerCase(),st=FL.payments.st;
  const planOf={};S.orders.forEach(o=>{planOf[o.id]=payPlan(o)});
  const info=p=>{const pl=planOf[p.orderId]||[];return pl.find(x=>x.p.id===p.id)||{n:1,after:0,cum:0}};
  const all=S.payments.map(p=>({p,o:byId('orders',p.orderId),s:payStatus(p),x:info(p),cnt:(planOf[p.orderId]||[]).length}));
  let rows=all.filter(r=>{
    if(st==='unpaid'&&r.p.paid)return false;
    if(st==='paid'&&!r.p.paid)return false;
    if(st==='late'&&r.s[1]!=='متأخرة')return false;
    if(st==='soon'&&r.s[1]!=='قريبة')return false;
    if(q){const hay=((r.p.label||'')+' '+orderLabel(r.o)+' '+(r.p.note||'')).toLowerCase();if(!hay.includes(q))return false}
    return true}).sort((a,b)=>(a.p.paid-b.p.paid)||(a.p.paid?(b.p.paidDate||'').localeCompare(a.p.paidDate||''):(a.p.dueDate||'9').localeCompare(b.p.dueDate||'9')));
  if(!S.payments.length)return empty('لا توجد دفعات','سجّل الدفعات المجدولة والمسدّدة لكل طلب.',`<button class="btn" data-act="new-payment">${ico('plus')} دفعة جديدة</button>`);
  const sPaid={},sSched={},sLate={};
  all.forEach(r=>{const c=r.o&&r.o.currency,a=+r.p.amount||0;if(r.p.paid)addTo(sPaid,c,a);else{addTo(sSched,c,a);if(r.s[1]==='متأخرة')addTo(sLate,c,a)}});
  const sum=`<div class="kv" style="margin-bottom:12px"><div><small>مدفوع إجمالاً</small><b>${multi(sPaid)}</b></div><div><small>مجدول غير مدفوع</small><b>${multi(sSched)}</b></div><div><small>متأخر</small><b style="color:${Object.keys(sLate).some(c=>sLate[c]>0)?'var(--bad)':'inherit'}">${multi(sLate)}</b></div></div>`;
  if(!rows.length)return sum+empty('لا نتائج','غيّر البحث أو التصفية.');
  return sum+`<table class="tbl"><thead><tr><th>الطلب</th><th>الدفعة</th><th class="n">المبلغ</th><th class="n">يتبقى بعدها</th><th>الاستحقاق</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td data-label="الطلب"><button class="link" data-act="open-order" data-id="${r.p.orderId}"><b>${esc(r.o?r.o.ref:'—')}</b><br><small style="color:var(--mute)">${esc(r.o?factoryName(r.o.factoryId):'')}</small></button></td><td data-label="الدفعة"><b>${ordName(r.x.n)}</b> <small style="color:var(--mute)">من ${r.cnt}</small>${r.p.label?'<br><small style="color:var(--mute)">'+esc(r.p.label)+'</small>':''}</td><td class="n" data-label="المبلغ">${money(r.p.amount,r.o&&r.o.currency)}</td><td class="n" data-label="يتبقى بعدها">${money(Math.max(r.x.after,0),r.o&&r.o.currency)}</td><td data-label="الاستحقاق">${r.p.paid?'سُدّدت '+fmtD(r.p.paidDate):fmtD(r.p.dueDate)+'<br><small style="color:var(--mute)">'+dueText(r.p.dueDate)+'</small>'}</td><td data-label="الحالة">${pill(r.s[0],r.s[1])}</td><td class="nolab"><div class="acts">${r.p.paid?'':`<button class="btn sm" data-act="pay-now" data-id="${r.p.id}">تسديد</button>`}<button class="icon" data-act="edit-payment" data-id="${r.p.id}" aria-label="تعديل">${ico('edit',16)}</button><button class="icon" data-act="del-ask" data-col="payments" data-id="${r.p.id}" aria-label="حذف">${ico('trash',16)}</button></div></td></tr>`).join('')}</tbody></table>`;
}
function shipmentsList(){
  const q=FL.shipments.q.trim().toLowerCase(),st=FL.shipments.st;
  let rows=S.shipments.map(s=>({s,c:byId('carriers',s.carrierId),o:byId('orders',s.orderId)})).filter(r=>{
    if(st&&r.s.status!==st&&!(st==='unpaid'&&shipRemaining(r.s)>0.001))return false;
    if(st==='unpaid'&&shipRemaining(r.s)<=0.001)return false;
    if(q){const hay=(r.s.ref+' '+(r.c?r.c.name:'')+' '+orderLabel(r.o)+' '+(r.s.note||'')).toLowerCase();if(!hay.includes(q))return false}
    return true}).sort((a,b)=>(a.s.status==='arrived')-(b.s.status==='arrived')||(a.s.eta||'9').localeCompare(b.s.eta||'9'));
  if(!S.shipments.length)return empty('لا توجد شحنات','اربط كل شحنة بالطلب وشركة الشحن لمتابعة التكلفة والوصول.',`<button class="btn" data-act="new-shipment">${ico('plus')} شحنة جديدة</button>`);
  if(!rows.length)return empty('لا نتائج','غيّر البحث أو التصفية.');
  return `<table class="tbl"><thead><tr><th>الشحنة</th><th>الطلب</th><th class="n">التكلفة</th><th class="n">المتبقي للشركة</th><th>الوصول المتوقع</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td data-label="الشحنة"><b>${esc(r.s.ref)}</b><br><small style="color:var(--mute)">${esc(r.c?r.c.name:'—')}</small></td><td data-label="الطلب">${r.o?`<button class="link" data-act="open-order" data-id="${r.o.id}">${esc(orderLabel(r.o))}</button>`:'—'}</td><td class="n" data-label="التكلفة">${money(r.s.cost,r.s.currency)}</td><td class="n" data-label="المتبقي للشركة">${money(shipRemaining(r.s),r.s.currency)}</td><td data-label="الوصول المتوقع">${fmtD(r.s.eta)}${r.s.status!=='arrived'&&r.s.eta?'<br><small style="color:var(--mute)">'+dueText(r.s.eta)+'</small>':''}</td><td data-label="الحالة">${pill(SHIP_K[r.s.status],shipName(r.s.status))}</td><td class="nolab"><div class="acts"><button class="icon" data-act="edit-shipment" data-id="${r.s.id}" aria-label="تعديل">${ico('edit',16)}</button><button class="icon" data-act="del-ask" data-col="shipments" data-id="${r.s.id}" aria-label="حذف">${ico('trash',16)}</button></div></td></tr>`).join('')}</tbody></table>`;
}
const LISTS={orders:ordersList,payments:paymentsList,shipments:shipmentsList};

function forecastCard(unpaid){
  const B=[['late','متأخرة'],['w0','خلال ٧ أيام'],['w1','من ٨ إلى ١٤ يوماً'],['w2','من ١٥ إلى ٢١ يوماً'],['w3','من ٢٢ إلى ٢٨ يوماً'],['later','بعد ٢٨ يوماً'],['none','بدون موعد']];
  const g={};B.forEach(b=>g[b[0]]={n:0,s:{}});
  unpaid.forEach(p=>{const o=byId('orders',p.orderId);let k;if(!p.dueDate)k='none';else{const d=diffDays(p.dueDate);k=d<0?'late':d<=7?'w0':d<=14?'w1':d<=21?'w2':d<=28?'w3':'later'}g[k].n++;addTo(g[k].s,o&&o.currency,+p.amount||0)});
  const rows=B.filter(b=>g[b[0]].n);
  return `<div class="card"><h3>توقّع الدفعات</h3><ul class="list">${rows.map(b=>`<li><div class="t"><b>${b[1]}</b><small>${g[b[0]].n} دفعة</small></div><div class="r">${multi(g[b[0]].s)}</div></li>`).join('')||'<li style="color:var(--mute)">لا توجد دفعات غير مسدّدة</li>'}</ul></div>`;
}
const isoOf=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDT=ms=>{const d=new Date(ms);return fmtD(isoOf(ms))+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function dashboard(){
  const open=S.orders.filter(o=>o.stage!=='received').map(o=>({o,i:oi(o)}));
  const late=open.filter(r=>r.i.timing&&r.i.timing.k==='bad');
  const ready=open.filter(r=>r.o.stage==='ready');
  const unpaid=S.payments.filter(p=>!p.paid);
  const dueSoon=unpaid.filter(p=>p.dueDate&&diffDays(p.dueDate)>=0&&diffDays(p.dueDate)<=7);
  const lateP=unpaid.filter(p=>p.dueDate&&diffDays(p.dueDate)<0);
  const rem={};S.orders.forEach(o=>addTo(rem,o.currency,oi(o).remaining));
  const sumOf=arr=>{const o={};arr.forEach(p=>{const ord=byId('orders',p.orderId);addTo(o,ord&&ord.currency,+p.amount||0)});return o};
  const dueSum=sumOf(dueSoon),lateSum=sumOf(lateP);
  const transit=S.shipments.filter(s=>s.status==='transit');
  const carrBal={};S.shipments.forEach(s=>{const k=s.carrierId;carrBal[k]=carrBal[k]||{};addTo(carrBal[k],s.currency,shipRemaining(s))});
  const carrTotal={};Object.values(carrBal).forEach(b=>Object.keys(b).forEach(c=>addTo(carrTotal,c,b[c])));
  const alerts=[];
  late.forEach(r=>alerts.push({k:'bad',t:`الطلب ${r.o.ref} (${factoryName(r.o.factoryId)}) متأخر عن موعد التجهيز`,s:dueText(r.o.prepDate),act:'open-order',id:r.o.id}));
  lateP.forEach(p=>{const o=byId('orders',p.orderId);alerts.push({k:'bad',t:`دفعة ${p.label||''} للطلب ${o?o.ref:'—'} متأخرة`,s:money(p.amount,o&&o.currency)+' · '+dueText(p.dueDate),act:'open-order',id:p.orderId})});
  unpaid.filter(p=>p.dueDate&&diffDays(p.dueDate)>=0&&diffDays(p.dueDate)<=3).forEach(p=>{const o=byId('orders',p.orderId);alerts.push({k:'warn',t:`دفعة ${p.label||''} للطلب ${o?o.ref:'—'} تستحق قريباً`,s:money(p.amount,o&&o.currency)+' · '+dueText(p.dueDate),act:'open-order',id:p.orderId})});
  S.orders.filter(o=>o.stage==='shipped').forEach(o=>{const ss=S.shipments.filter(s=>s.orderId===o.id);if(ss.length&&ss.every(s=>s.status==='arrived'))alerts.push({k:'warn',t:`كل شحنات الطلب ${o.ref} وصلت. حدّث المرحلة إلى «مستلم»`,s:factoryName(o.factoryId),act:'open-order',id:o.id})});
  transit.filter(s=>s.eta&&diffDays(s.eta)<0).forEach(s=>alerts.push({k:'warn',t:`الشحنة ${s.ref} تجاوزت موعد الوصول المتوقع`,s:dueText(s.eta),act:'edit-shipment',id:s.id}));
  ready.filter(r=>!S.shipments.some(s=>s.orderId===r.o.id)).forEach(r=>alerts.push({k:'warn',t:`الطلب ${r.o.ref} جاهز للشحن ولم تُسجَّل له شحنة`,s:factoryName(r.o.factoryId),act:'open-order',id:r.o.id}));
  alerts.sort((a,b)=>(a.k==='bad'?0:1)-(b.k==='bad'?0:1));
  const kpi=(l,v,s,k,view,st)=>`<button class="kpi ${k||''}" data-act="nav" data-view="${view}" data-st="${st||''}"><span>${l}</span><b>${v}</b><small>${s||'&nbsp;'}</small></button>`;
  const upPays=unpaid.slice().sort((a,b)=>(a.dueDate||'9').localeCompare(b.dueDate||'9')).slice(0,6);
  const upPrep=open.filter(r=>r.o.prepDate&&!['ready','shipped'].includes(r.o.stage)).sort((a,b)=>a.o.prepDate.localeCompare(b.o.prepDate)).slice(0,6);
  const hasData=S.orders.length||S.payments.length||S.factories.length;
  const bk=META.backup,bAge=bk?Math.floor((Date.now()-bk.at)/864e5):null;
  const nudge=metaLoaded&&hasData&&(!bk||bAge>=14)?`<div class="hint nudge"><span>${bk?'آخر نسخة احتياطية قبل '+plural(bAge)+'.':'لم تُحفظ نسخة احتياطية بعد.'} احفظ نسخة لحماية بياناتك.</span><button class="btn sm" data-act="export-json">${ico('down',15)} حفظ نسخة الآن</button></div>`:'';
  const welcome=!S.orders.length&&!S.factories.length?`<div class="card"><h3>ابدأ من هنا</h3><span style="color:var(--mute)">أدخل بياناتك الحقيقية. لا توجد أسماء أو أرقام جاهزة في النظام.</span><ol class="steps"><li><b>١. المصانع</b>أضف المصانع التي تتعامل معها.</li><li><b>٢. الطلبات</b>سجّل الطلب وبنوده وموعد التجهيز.</li><li><b>٣. الدفعات</b>جدول الدفعات وسدّدها عند التحويل.</li><li><b>٤. الشحن</b>أضف شركات الشحن وربط الشحنات بالطلبات.</li></ol><div class="bar" style="margin-top:12px"><button class="btn" data-act="new-factory">${ico('plus')} أضف أول مصنع</button><button class="btn ghost" data-act="demo-load">تحميل بيانات تجريبية للتعرف على النظام</button></div></div>`:'';
  return `${welcome}${nudge}
  <div class="kpis">
    ${kpi('طلبات مفتوحة',open.length,'لم تُستلم بعد','', 'orders','open')}
    ${kpi('طلبات متأخرة',late.length,'عن موعد التجهيز',late.length?'bad':'', 'orders','late')}
    ${kpi('جاهزة للشحن',ready.length,'بانتظار شحنة',ready.length?'warn':'', 'orders','ready')}
    ${kpi('شحنات بالطريق',transit.length,'قيد النقل','', 'shipments','transit')}
    ${kpi('دفعات متأخرة',lateP.length,lateP.length?multi(lateSum):'لا توجد متأخرات',lateP.length?'bad':'ok', 'payments','late')}
    ${kpi('دفعات خلال ٧ أيام',dueSoon.length,dueSoon.length?multi(dueSum):'لا مستحقات قريبة',dueSoon.length?'warn':'', 'payments','soon')}
    ${kpi('المتبقي للمصانع',multi(rem,true),'على كل الطلبات','', 'payments','unpaid')}
    ${kpi('مستحق لشركات الشحن',multi(carrTotal,true),'رصيد غير مسدّد','', 'carriers','')}

function restoreFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let j;try{j=JSON.parse(r.result)}catch(e){toast('الملف غير صالح','bad');return}
    if(!j||j.app!=='trade-system'||!j.data||typeof j.data!=='object'){toast('هذا ليس ملف نسخة احتياطية لهذا النظام','bad');return}
    const okId=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
    const clean={};let skipped=0;
    COLS.forEach(c=>{clean[c]=[];(Array.isArray(j.data[c])?j.data[c]:[]).forEach(d=>{if(d&&typeof d==='object'&&!Array.isArray(d)&&okId.test(String(d.id||'')))clean[c].push(d);else skipped++})});
    const names={factories:'مصانع',orders:'طلبات',payments:'دفعات',carriers:'شركات شحن',shipments:'شحنات'};
    openModal('استعادة نسخة',`<p>ستتم إضافة السجلات التالية. السجل المطابق بنفس المعرّف يُستبدل بما في النسخة.</p><ul class="list">${COLS.map(c=>`<li><span>${names[c]}</span><b>${clean[c].length}</b></li>`).join('')}</ul>${skipped?`<div class="hint bad">سيتم تجاهل ${skipped} سجل غير صالح.</div>`:''}`,{submitText:'استعادة',onSubmit:async()=>{
      try{let n=0;for(const c of COLS)for(const d of clean[c]){await put(c,d,{quiet:true});n++}logAct('restore','','استعادة '+n+' سجل من نسخة احتياطية');closeModal(true);toast('تمت الاستعادة')}catch(e){}}});
  };
  r.readAsText(file);
}

const ADD={orders:['طلب جديد','new-order'],payments:['دفعة جديدة','new-payment'],shipments:['شحنة جديدة','new-shipment'],factories:['مصنع جديد','new-factory'],carriers:['شركة شحن','new-carrier']};
let cur='home';
try{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))cur=h}catch(e){}
const navList=()=>NAV.filter(n=>n[0]!=='users'||ADMIN);
function go(v){cur=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
function greet(){const h=new Date().getHours();return h<12?'صباح الخير':h<18?'مرحباً':'مساء الخير'}
const MAIN=['home','orders','payments','shipments'];
function shell(){
  $('#side').style.display='';
  $('#side').innerHTML='<div class="brand"><i></i>الطلبات والشحن</div>'+navList().map(n=>`<button class="nav ${MAIN.includes(n[0])?'':'sec'}" data-act="nav" data-view="${n[0]}" ${n[0]===cur?'aria-current="page"':''}>${ico(n[2])}<span>${n[1]}</span></button>`).join('')+`<button class="nav morebtn" data-act="more" aria-haspopup="true" ${MAIN.includes(cur)?'':'aria-current="page"'}>${ico('menu')}<span>المزيد</span></button><button class="nav sec" data-act="logout" title="${esc(SB_NAME)}">${ico('out')}<span>خروج</span></button>`;
  const mr=$('#more');mr.hidden=true;
  mr.firstElementChild.innerHTML=navList().filter(n=>!MAIN.includes(n[0])).map(n=>`<button class="sheetbtn" data-act="nav" data-view="${n[0]}" ${n[0]===cur?'aria-current="page"':''}>${ico(n[2],24)}<span>${n[1]}</span></button>`).join('')+`<button class="sheetbtn" data-act="logout">${ico('out',24)}<span>خروج (${esc(SB_NAME)})</span></button>`;
  $('#title').textContent=cur==='home'?greet():TITLES[cur];
  $('#sub').textContent=new Date().toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(SB_NAME?' · '+SB_NAME+' ('+(ADMIN?'مدير':'موظف')+')':'');
  const a=ADD[cur];$('#topact').innerHTML=a?`<button class="btn" data-act="${a[1]}">${ico('plus')} ${a[0]}</button>`:'';
}
function render(){
  shell();
  const v=$('#view');
  if(dbFail){v.innerHTML=empty('تعذر الوصول إلى قاعدة البيانات','تحقق من الاتصال بالإنترنت ثم حدّث الصفحة. إن استمرت المشكلة سجّل الخروج والدخول مجدداً.');return}
  if(cur==='users'){if(!ADMIN){go('home');return}usersView();return}
  if(COLS.some(c=>!loaded[c])){v.innerHTML='<div class="skel"></div><div class="skel"></div>';return}
  if(cur==='home')v.innerHTML=dashboard();
  else if(LISTS[cur]){
    const opts={orders:[['','كل الطلبات'],['open','المفتوحة'],['late','المتأخرة'],['unpaid','عليها متبقٍ'],['production','قيد التصنيع'],['ready','جاهزة للشحن'],['shipped','تم الشحن'],['received','المستلمة']],
      payments:[['','كل الدفعات'],['unpaid','غير مدفوعة'],['soon','تستحق خلال ٧ أيام'],['late','متأخرة'],['paid','مدفوعة']],
      shipments:[['','كل الشحنات'],['preparing','قيد التجهيز'],['transit','بالطريق'],['arrived','وصلت'],['unpaid','عليها رصيد']]}[cur];
    v.innerHTML=toolbar(cur,opts);$('#list').innerHTML=LISTS[cur]();
    $('#q_'+cur).addEventListener('input',e=>{FL[cur].q=e.target.value;$('#list').innerHTML=LISTS[cur]()});
    $('#s_'+cur).addEventListener('change',e=>{FL[cur].st=e.target.value;$('#list').innerHTML=LISTS[cur]()});
  }
  else if(cur==='factories')v.innerHTML=factoriesView();
  else if(cur==='carriers')v.innerHTML=carriersView();
  else if(cur==='activity'){v.innerHTML=activityView();fillNames()}
  else v.innerHTML=backupView();
  const rf=$('#restoreFile');if(rf)rf.addEventListener('change',e=>{if(e.target.files[0])restoreFile(e.target.files[0]);e.target.value=''});
}
function refresh(){
  if(COLS.some(c=>!loaded[c])){return}
  const l=$('#list');
  if(l&&LISTS[cur]&&$('#view .skel')==null){l.innerHTML=LISTS[cur]()}else render();
  if(M.refresh)M.refresh();
}

/* ---------- actions ---------- */
const ADMIN_ACTS=new Set(['set-role','new-payment','edit-payment','pay-now','new-factory','edit-factory','new-carrier','edit-carrier','del-ask','del-ok','demo-load','demo-clear','pick-restore']);
document.addEventListener('click',e=>{
  if(e.target.id==='more'){e.target.hidden=true;return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.tagName==='TR'&&e.target.closest('button,a'))return;
  const d=t.dataset,id=d.id;
  if(!ADMIN&&ADMIN_ACTS.has(d.act)){toast('هذا الإجراء للمدير فقط','bad');return}
  switch(d.act){
    case 'nav':closeModal(true);if(FL[d.view]){FL[d.view].q='';FL[d.view].st=d.st||''}go(d.view);break;
    case 'close':closeModal();break;
    case 'more':{const mr=$('#more');mr.hidden=!mr.hidden;break}
    case 'new-factory':factoryForm(null,M.back);break;
    case 'open-factory':openFactory(id);break;
    case 'edit-factory':factoryForm(byId('factories',id),M.el?()=>openFactory(id):null);break;
    case 'new-carrier':carrierForm();break;
    case 'edit-carrier':carrierForm(byId('carriers',id));break;
    case 'new-order':orderForm();break;
    case 'open-order':openOrder(id);break;
    case 'edit-order':orderForm(byId('orders',id),()=>openOrder(id));break;
    case 'new-payment':{const o=d.order;paymentForm(null,o,o?()=>openOrder(o):null);break}
    case 'edit-payment':{const p=byId('payments',id);paymentForm(p,null,M.el&&p?()=>openOrder(p.orderId):null);break}
    case 'next-stage':{const o=byId('orders',id);if(o&&NEXT[o.stage]){const nx=NEXT[o.stage][0];put('orders',Object.assign({},o,{stage:nx})).then(()=>toast('تم نقل الطلب إلى: '+stageName(nx))).catch(()=>{})}break}
    case 'pay-now':{const p=byId('payments',id);if(p)put('payments',Object.assign({},p,{paid:true,paidDate:todayISO()})).then(()=>toast('تم تسجيل التسديد')).catch(()=>{});break}
    case 'new-shipment':{const o=d.order;shipmentForm(null,o,o?()=>openOrder(o):null);break}
    case 'edit-shipment':{const s=byId('shipments',id);shipmentForm(s,null,M.el&&s&&s.orderId?()=>openOrder(s.orderId):null);break}
    case 'add-item':{const b=$('#items');b.insertAdjacentHTML('beforeend',itemRow());b.lastElementChild.querySelector('.iname').focus();break}
    case 'rm-item':{const r=t.closest('.irow');const b=$('#items');if(b.children.length>1)r.remove();else r.querySelectorAll('input').forEach(i=>i.value='');updItemsTotal();break}
    case 'pct':{const f=$('#mform'),o=f&&byId('orders',f.elements.orderId.value);if(!o)break;const tot=itemsTotal(o);if(!tot){ferr('أضف بنوداً للطلب أولاً حتى تُحسب النسبة');break}
      f.elements.amount.value=r2(tot*(+d.pct)/100);f.elements.amount.dispatchEvent(new Event('input',{bubbles:true}));break}
    case 'use-suggest':{const f=$('#mform');if(!f)break;if(!f.dataset.sug){toast('لا يوجد باقٍ لاقتراحه','bad');break}
      f.elements.amount.value=f.dataset.sug;f.elements.amount.dispatchEvent(new Event('input',{bubbles:true}));break}
    case 'pick-items':$('#itemsFile').click();break;
    case 'pick-restore':$('#restoreFile').click();break;
    case 'del-ask':askDelete(d.col,id);break;
    case 'del-ok':doDelete(d.col,id);break;
    case 'export-xlsx':exportXlsx();break;
    case 'export-json':exportJson();break;
    case 'demo-load':demoLoad();break;
    case 'demo-clear':demoClear();break;
    case 'set-role':setRole(id,d.role);break;
    case 'logout':sb.auth.signOut().then(()=>location.reload());break;
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.click,.cards .card')&&!e.target.closest('.mb')){e.preventDefault();e.target.click()}
});
bootAuth().then(ok=>{if(ok){render();init()}}).catch(()=>authScreen({t:'تعذر الاتصال بالخادم. تحقق من الإنترنت.',bad:true}));
</script>

</body></html>
