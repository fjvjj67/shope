<style>
/* Layout: glass sidebar + content grid (dark-first, like the reference dashboard); bottom tab bar on phones */

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){

:root[data-theme="light"]{

  --line:rgba(255,226,200,.10); --panel:#1d1510; --fg:#f6ebdf; --mute:#b6a08c; --accent:#ff8a3d; --on-accent:#2a1405;
  --ok:#86d49f; --warn:#f2c060; --bad:#ff7d6b; --info:#8fc3ec; --shadow:0 12px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body);
  background-image:radial-gradient(900px 500px at 85% -10%,var(--bg-glow),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(108,179,236,.07),transparent 60%);

.app{display:grid;grid-template-columns:208px minmax(0,1fr);gap:18px;max-width:1320px;margin-inline:auto;padding-inline:16px;padding-block:18px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);align-self:start;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

main{min-width:0;display:flex;flex-direction:column;gap:16px}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const diffDays=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);
const fmtD=iso=>iso?iso.split('-').reverse().join('/'):'—';
const num=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const CUR={USD:'$',CNY:'¥'};
const money=(n,c)=>'<bdi dir="ltr">'+(CUR[c]||c||'$')+num(n)+'</bdi>';
const addTo=(o,c,v)=>{c=c||'USD';o[c]=(o[c]||0)+v};
const multi=(o,stack)=>{const k=Object.keys(o).filter(c=>Math.abs(o[c])>0.001);if(!k.length)return money(0,'CNY');return k.map(c=>stack?'<span class="stk">'+money(o[c],c)+'</span>':money(o[c],c)).join(stack?'':' · ')};
const plural=n=>n===1?'يوم':n===2?'يومان':n<=10?n+' أيام':n+' يوماً';
const dueText=iso=>{if(!iso)return 'بدون موعد';const d=diffDays(iso);return d<0?'متأخر '+plural(-d):d===0?'اليوم':d===1?'غداً':'بعد '+plural(d)};
const dueKind=iso=>{if(!iso)return 'mute';const d=diffDays(iso);return d<0?'bad':d<=7?'warn':'info'};
const pill=(k,t)=>`<span class="pill ${k}">${esc(t)}</span>`;
const ICONS={
 menu:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
 ship:'<path d="M3 17l2 3h14l2-3-9-3z"/><path d="M12 14V4l5 4"/>',
 factory:'<path d="M3 21V10l6 4v-4l6 4V6h6v15z"/>',
 truck:'<path d="M2 6h11v10H2zM13 10h5l3 3v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
 db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 building:'<path d="M4 21V5l8-2v18M12 8l8 2v11M8 8h1M8 12h1M8 16h1M16 13h1M16 17h1M3 21h18"/>',users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.4 2.7-5.5 6-5.5s6 2.1 6 5.5M16 5.5a3 3 0 0 1 0 5.8M18 14.8c1.9.6 3 2.3 3 5.2"/>',out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',check:'<path d="M5 12l5 5 9-10"/>',edit:'<path d="M4 20h4l11-11-4-4L4 16z"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'
};
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
let toastT;
function toast(msg,kind){const old=$('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast '+(kind||'');t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}

/* ---------- data layer ---------- */
const COLS=['factories','orders','payments','carriers','shipments'];
const SCOPED=[...COLS,'ledger','ctx'],LOADS=[...SCOPED,'companies'],RAW={};
const S={};LOADS.forEach(c=>{S[c]=[];RAW[c]=[]});
const loaded={};let db=null,dbFail=false;
let CANEDIT=false,LOCK_CO=null;
let ADMIN=false,SB=null,SBDB=null,ME=null,PROFILES={};const ADMIN_COLS=['payments','factories','carriers','companies','ledger','ctx'];
let ACT=[],actLoaded=false,META={},metaLoaded=false,myId=null,userNS=null;
const byId=(col,id)=>S[col].find(x=>x.id===id);
let pending=false;
function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;refresh()})}
async function init(){
  db=SBDB;
  if(!db){dbFail=true;render();return}
  myId=ME.id;ADMIN=ME.role==='admin';CANEDIT=ADMIN||ME.role==='staff';
  userNS={profiles:async ids=>{const o={};[].concat(ids).forEach(i=>{const p=PROFILES[i];o[i]={id:i,name:p?(p.name||p.email):'',isMe:i===myId}});return o}};
  document.body.classList.toggle('ro',!CANEDIT);document.body.classList.toggle('nodel',!ADMIN);schedule();
  try{db.collection('activity').orderBy('at','desc').limit(150).onSnapshot(snap=>{ACT=snap.docs.map(d=>Object.assign({id:d.id},d.data()));actLoaded=true;if(cur==='activity')schedule()},()=>{actLoaded=true})}catch(e){}
  try{db.doc('meta/gsheet').onSnapshot(sn=>{META.gsheet=sn.exists?sn.data():null;if(cur==='backup')schedule()},()=>{})}catch(e){}
  initGS();
  try{db.doc('meta/backup').onSnapshot(sn=>{META.backup=sn.exists?sn.data():null;metaLoaded=true;if(cur==='home'||cur==='backup')schedule()},()=>{metaLoaded=true})}catch(e){}
  LOADS.forEach(name=>{
    db.collection(name).onSnapshot(snap=>{RAW[name]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(name==='companies')setCompanies(RAW.companies);else if(SCOPED.includes(name))S[name]=RAW[name].filter(d=>cid(d)===ACTIVE);loaded[name]=true;schedule()},
      e=>{dbFail=true;toast('تعذر تحميل البيانات','bad');render()});
  });
}
const newId=col=>db.collection(col).doc().id;
const COL_TXT={factories:'مصنع',orders:'طلب',payments:'دفعة',carriers:'شركة شحن',shipments:'شحنة',companies:'شركة',ledger:'حركة حساب',ctx:'حركة شركة شحن'};
function labelOf(col,o){
  if(!o)return '';
  if(col==='factories'||col==='carriers'||col==='companies')return o.name||'';
  if(col==='ctx')return (o.type==='in'?'تحويل لـ ':o.type==='fee'?'مصروف عند ':'')+((byId('carriers',o.carrierId)||{}).name||'')+' · '+num(o.amt)+' '+(CUR[o.cur]||'');
  if(col==='ledger')return (o.type==='out'?'سحب ':'إيداع ')+num(o.amount)+' '+(CUR[o.currency]||'')+' · '+coName(o.companyId);
  if(col==='orders')return (o.ref||'')+' · '+factoryName(o.factoryId);
  if(col==='shipments')return o.ref||'';
  if(col==='payments'){const ord=byId('orders',o.orderId);return (ord?ord.ref:'—')+' · '+num(o.amount)+' '+(CUR[ord&&ord.currency]||'')+(o.label?' · '+o.label:'')}
  return '';
}
function logAct(act,col,label){
  if(!db)return;
  try{db.collection('activity').add({at:Date.now(),by:myId||'',companyId:ACTIVE||DEFAULT_CO,act,col:col||'',label:String(label||'').slice(0,200)}).catch(()=>{})}catch(e){}
}
async function put(col,obj,opts){
  opts=opts||{};if(!CANEDIT&&ADMIN_COLS.includes(col)){toast('ما عندك صلاحية لهذا الإجراء','bad');throw new Error('admin_only')}
  const {id,...rest}=obj;const old=byId(col,id);
  if(SCOPED.includes(col)&&!rest.companyId)rest.companyId=ACTIVE||DEFAULT_CO;
  try{await db.collection(col).doc(id).set(rest)}
  catch(e){toast(e&&e.code==='quota_exceeded'?'امتلأت سعة قاعدة البيانات':'تعذر الحفظ. تحقق من صلاحيات التعديل','bad');throw e}
  if(!opts.noSync)queueGS();
  if(!opts.quiet){
    let act=old?'edit':'add',extra='';
    if(col==='payments'&&obj.paid&&!(old&&old.paid))act='pay';
    if(col==='orders'&&old&&old.stage!==obj.stage){act='stage';extra=' ← '+stageName(obj.stage)}
    logAct(act,col,labelOf(col,obj)+extra);
  }
}
async function remove(col,id,opts){
  opts=opts||{};if(!ADMIN){toast('الحذف للمدير فقط','bad');throw new Error('admin_only')}
  const old=byId(col,id);
  try{await db.collection(col).doc(id).delete()}catch(e){toast('تعذر الحذف','bad');throw e}
  queueGS();
  if(!opts.quiet)logAct('delete',col,(opts.label||labelOf(col,old)));
}



/* ---------- attachments: chunked storage, thumbnails, popup viewer, sheet preview ---------- */
let PEND=[],ATT_E=[];const FILE_MAX=8*1024*1024,CHUNK=180000;
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round((n||0)/1024))+' KB';
const isImg=t=>/^image\//.test(t||''),isSheet=n=>/\.(xlsx|xls|csv)$/i.test(n||'');
const readDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('read'));r.readAsDataURL(f)});
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=u});
function drawJpeg(img,max,q){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function prepFile(file){
  if(isImg(file.type)||/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(file.name)){
    const url=await readDataURL(file);let img;
    try{img=await loadImg(url)}catch(e){if(file.size>FILE_MAX)throw new Error('big');return {name:file.name,type:file.type||'image/*',size:file.size,data:url,thumb:''}}
    const data=drawJpeg(img,1600,.82),thumb=drawJpeg(img,260,.6);
    return {name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:Math.round(data.length*.75),data,thumb};
  }
  if(file.size>FILE_MAX)throw new Error('big');
  let type=file.type;if(!type)type=/\.csv$/i.test(file.name)?'text/csv':/\.xlsx$/i.test(file.name)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':/\.xls$/i.test(file.name)?'application/vnd.ms-excel':/\.pdf$/i.test(file.name)?'application/pdf':'application/octet-stream';
  return {name:file.name,type,size:file.size,data:await readDataURL(file),thumb:''};
}
async function writeFileDoc(fid,d){
  const parts=[];for(let i=0;i<d.data.length;i+=CHUNK)parts.push(d.data.slice(i,i+CHUNK));
  for(let k=0;k<parts.length;k++)await db.collection('fchunks').doc(fid+'_'+k).set({fid,k,data:parts[k]});
  await db.collection('files').doc(fid).set({orderId:d.orderId||'',companyId:d.companyId||ACTIVE||DEFAULT_CO,name:d.name,type:d.type,size:d.size||0,n:parts.length,at:d.at||Date.now()});
}
async function storeFile(oid,a){const fid=newId('files');const o=byId('orders',oid);await writeFileDoc(fid,{orderId:oid,companyId:(o&&o.companyId)||ACTIVE,name:a.name,type:a.type,size:a.size,data:a.data});return {id:fid,name:a.name,type:a.type,size:a.size,thumb:a.thumb||''}}
async function loadFile(fid){
  const sn=await db.collection('files').doc(fid).get();if(!sn.exists)return null;const d=sn.data();
  if(d.data)return d;
  const cs=await Promise.all(Array.from({length:d.n||0},(_,k)=>db.collection('fchunks').doc(fid+'_'+k).get()));
  if(cs.some(c=>!c.exists))return null;
  return Object.assign({},d,{data:cs.map(c=>c.data().data).join('')});
}
async function dropFile(fid){
  let n=0;try{const sn=await db.collection('files').doc(fid).get();if(sn.exists)n=sn.data().n||0}catch(e){}
  for(let k=0;k<n;k++)try{await db.collection('fchunks').doc(fid+'_'+k).delete()}catch(e){}
  await db.collection('files').doc(fid).delete();
}
async function queueAttach(files,quiet){
  for(const f of files){
    try{PEND.push(await prepFile(f))}
    catch(e){if(!quiet)toast(e&&e.message==='big'?'«'+f.name+'» أكبر من 8 MB':'تعذر قراءة «'+f.name+'»','bad')}
  }
  renderAtt();
}
function attIcon(f){return isImg(f.type)&&f.thumb?`<img class="athumb" src="${f.thumb}" alt="">`:`<span class="aicon">${isSheet(f.name)?'XLS':/pdf/i.test(f.type)?'PDF':isImg(f.type)?'IMG':'FILE'}</span>`}
function renderAtt(){
  const el=$('#attList');if(!el)return;
  const li=(f,extra)=>`<li class="arow">${attIcon(f)}<div class="t"><b>${esc(f.name)}</b><small>${fmtSize(f.size)}</small></div><div class="r">${extra||''}</div></li>`;
  el.innerHTML=ATT_E.map(f=>li(f,pill('mute','محفوظ'))).join('')+PEND.map((f,i)=>li(f,pill('warn','جديد')+`<button type="button" class="icon" data-act="rm-pend" data-i="${i}" aria-label="إزالة">${ico('x',16)}</button>`)).join('');
}
async function attachToOrder(oid,files){
  if(!files.length)return;
  toast('جارٍ رفع '+(files.length>1?files.length+' ملفات':'الملف')+'…');
  const metas=[];
  for(const f of files){
    let a;try{a=await prepFile(f)}catch(e){toast(e&&e.message==='big'?'«'+f.name+'» أكبر من 8 MB':'تعذر قراءة «'+f.name+'»','bad');continue}
    try{metas.push(await storeFile(oid,a))}catch(e){toast('تعذر حفظ «'+f.name+'»','bad')}
  }
  const o=byId('orders',oid);if(!o||!metas.length)return;
  try{await put('orders',Object.assign({},o,{files:(o.files||[]).concat(metas)}),{quiet:true});logAct('edit','orders','مرفق للطلب '+o.ref);toast(metas.length>1?'تم إرفاق '+metas.length+' ملفات':'تم إرفاق الملف')}catch(e){}
}
function attSection(o){

/* ---------- business logic ---------- */
const STAGES=[['production','قيد التصنيع'],['ready','جاهز للشحن'],['shipped','تم الشحن'],['received','مستلم']];
const STAGE_K={production:'info',ready:'warn',shipped:'info',received:'ok'};
const stageName=s=>(STAGES.find(x=>x[0]===s)||[0,'—'])[1];
const SHIP_ST=[['preparing','قيد التجهيز'],['transit','بالطريق'],['arrived','وصلت']];
const SHIP_K={preparing:'warn',transit:'info',arrived:'ok'};
const shipName=s=>(SHIP_ST.find(x=>x[0]===s)||[0,'—'])[1];
const r2=n=>Math.round(((+n||0)+Number.EPSILON)*100)/100;
const itemsTotal=o=>{const it=o.items||[];return it.length?r2(it.reduce((a,i)=>a+r2((+i.qty||0)*(+i.price||0)),0)):r2(+o.total||0)};
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
const ordName=n=>'الدفعة '+(ORD[n-1]||('رقم '+n));
const payKey=p=>(p.dueDate||p.paidDate||'9999-12-31');
function orderedPays(orderId,excludeId){
  return S.payments.filter(p=>p.orderId===orderId&&p.id!==excludeId).sort((a,b)=>payKey(a).localeCompare(payKey(b))||((a.createdAt||0)-(b.createdAt||0)));
}
/* ordered payment plan of an order: each payment with its number, running total and what is left after it */
function payPlan(o,excludeId){
  const total=itemsTotal(o);let cum=0;
  return orderedPays(o.id,excludeId).map((p,i)=>{cum=r2(cum+(+p.amount||0));return {p,n:i+1,cum,after:r2(total-cum)}});
}
function oi(o){
  const total=itemsTotal(o);
  const pays=S.payments.filter(p=>p.orderId===o.id);
  const paid=r2(pays.filter(p=>p.paid).reduce((a,p)=>a+(+p.amount||0),0));
  const scheduled=r2(pays.filter(p=>!p.paid).reduce((a,p)=>a+(+p.amount||0),0));
  const remaining=r2(Math.max(total-paid,0));
  const unscheduled=r2(Math.max(total-paid-scheduled,0));
  const unpaid=pays.filter(p=>!p.paid);
  const lateP=unpaid.some(p=>p.dueDate&&diffDays(p.dueDate)<0);
  let pay;
  if(!total)pay=['mute','بدون مبلغ'];else if(remaining<=0.001)pay=['ok','مدفوع'];else if(lateP)pay=['bad','متأخرة'];else if(paid>0)pay=['warn','جزئي'];else pay=['info','مستحق'];
  const done=['ready','shipped','received'].includes(o.stage);
  let timing=null;
  if(!done&&o.prepDate){const d=diffDays(o.prepDate);timing=d<0?{k:'bad',t:'متأخر '+plural(-d)}:d<=7?{k:'warn',t:d===0?'اليوم':'بعد '+plural(d)}:{k:'ok',t:'في الموعد'}}
  let recv=null;
  if(o.stage!=='received'&&o.recvDate){const d=diffDays(o.recvDate);recv=d<0?{k:'bad',t:'متأخر '+plural(-d)}:d<=7?{k:'warn',t:d===0?'اليوم':'بعد '+plural(d)}:{k:'ok',t:'بعد '+plural(d)}}
  return {total,paid,scheduled,unscheduled,remaining,pay,timing,recv,pays};
}
function dateLines(o,i){
  const ln=(l,d,t)=>d?`<div class="dline"><small>${l}</small>${t&&t.k!=='ok'?pill(t.k,t.t):''}<small>${fmtD(d)}</small></div>`:'';
  return (ln('تجهيز',o.prepDate,i.timing)+ln('استلام',o.recvDate,i.recv))||'<span style="color:var(--mute)">—</span>';
}

const orderLabel=o=>o?(o.ref||'بدون رقم')+' · '+factoryName(o.factoryId):'—';
const carrOpen=(c,o)=>{if(c&&+c.openBal)addTo(o,c.openCur||'USD',+c.openBal);return o};
const balTxt=o=>{const k=Object.keys(o).filter(c=>Math.abs(o[c])>0.001);if(!k.length)return money(0,'CNY');return k.map(c=>o[c]<0?'لك '+money(-o[c],c):money(o[c],c)).join(' · ')};

function itemRow(it){
  it=it||{};

function readItems(){
  return [...document.querySelectorAll('#items .irow')].map(r=>({name:r.querySelector('.iname').value.trim(),qty:parseFloat(r.querySelector('.iqty').value)||0,price:parseFloat(r.querySelector('.iprice').value)||0})).filter(i=>i.name||i.qty||i.price);
}
function updItemsTotal(){
  const cur=document.getElementById('f_currency');if(!cur)return;
  const t=readItems().reduce((a,i)=>a+i.qty*i.price,0);
  $('#itot').innerHTML=money(t,cur.value);
}
function importItemsFile(file){
  if(!window.XLSX){toast('مكتبة Excel غير محمّلة','bad');return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(r.result,{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(x=>x.some(c=>String(c).trim()!==''));
      if(!rows.length){toast('الملف فارغ','bad');return}
      const head=rows[0].map(c=>String(c).toLowerCase());
      const find=(re,fb)=>{const i=head.findIndex(h=>re.test(h));return i>=0?i:fb};
      const iN=find(/اسم|منتج|صنف|بيان|name|product|item|desc/,0),iQ=find(/كمي|عدد|qty|quant|pcs/,1),iP=find(/سعر|price|unit/,2);
      const hasHead=head.some(h=>/اسم|منتج|صنف|بيان|كمي|عدد|سعر|name|product|item|qty|price/.test(h));
      const data=(hasHead?rows.slice(1):rows).map(x=>({name:String(x[iN]||'').trim(),qty:parseFloat(x[iQ])||0,price:parseFloat(x[iP])||0})).filter(i=>i.name);
      if(!data.length){toast('لم أجد بنوداً في الملف','bad');return}
      const box=$('#items');const only=box.querySelectorAll('.irow');
      if(only.length===1&&!readItems().length)box.innerHTML='';
      data.forEach(i=>box.insertAdjacentHTML('beforeend',itemRow(i)));
      updItemsTotal();toast('تم استيراد '+data.length+' بند');
    }catch(e){toast('تعذر قراءة الملف','bad')}
  };
  r.readAsArrayBuffer(file);
}

const DUR=[[15,'15 يوم'],[30,'شهر'],[45,'45 يوم'],[60,'شهرين'],[90,'3 أشهر']];
function durField(name,label,v){
  return `<div class="fld durf"><span>${label}</span><div class="chips">${DUR.map(d=>`<button type="button" class="chip" data-act="dur" data-t="${name}" data-d="${d[0]}">${d[1]}</button>`).join('')}</div>
  <div class="durrow"><label class="durn"><input type="number" inputmode="numeric" min="0" step="1" class="durdays" data-t="${name}" placeholder="أيام" aria-label="عدد الأيام"><small>يوم</small></label><input id="f_${name}" name="${name}" type="date" value="${esc(v||'')}" aria-label="${label}"></div>
  <small class="durhint" id="h_${name}"></small></div>`;
}
const baseDate=()=>{const f=$('#mform');return (f&&f.elements.orderDate&&f.elements.orderDate.value)||(f&&f.elements.departDate&&f.elements.departDate.value)||todayISO()};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
function markDur(f,name,days){f.querySelectorAll(`[data-act=dur][data-t="${name}"]`).forEach(b=>b.classList.toggle('on',+b.dataset.d===days))}
function setDur(name,days,fromInput){
  const f=$('#mform');if(!f||!f.elements[name]||!(days>0))return;const el=f.elements[name];
  el.value=addDays(baseDate(),days);el.dataset.days=days;
  if(!fromInput){const n=f.querySelector(`.durdays[data-t="${name}"]`);if(n)n.value=days}
  markDur(f,name,days);durHint(name);el.dispatchEvent(new Event('change',{bubbles:true}));
}
function durHint(name){
  const f=$('#mform'),h=$('#h_'+name);if(!f||!h||!f.elements[name])return;const v=f.elements[name].value;
  if(!v){h.textContent='';return}
  const d=diffDays(v);h.textContent='يوافق '+fmtD(v)+' · '+(d>0?'بعد '+plural(d)+' من اليوم':d===0?'اليوم':'مضى '+plural(-d));
}
function initDur(f,names){names=names||['prepDate','recvDate'];const baseEl=f.elements.orderDate||f.elements.departDate;
  names.forEach(n=>{const el=f.elements[n];if(!el)return;const box=f.querySelector(`.durdays[data-t="${n}"]`);
    const sync=()=>{const k=el.value?daysBetween(baseDate(),el.value):0;if(box)box.value=k>0?k:'';if(k>0)el.dataset.days=k;else delete el.dataset.days;markDur(f,n,k);durHint(n)};
    sync();el.addEventListener('input',sync);
    if(box)box.addEventListener('input',()=>{const v=parseInt(box.value,10);if(v>0)setDur(n,v,true);else markDur(f,n,0)})});
  if(baseEl)baseEl.addEventListener('change',()=>names.forEach(n=>{const el=f.elements[n];if(el&&el.dataset.days)setDur(n,+el.dataset.days)}));
}
function planHTML(o,excludeId,editing){
  const plan=payPlan(o,excludeId),total=itemsTotal(o);
  const recorded=plan.length?plan[plan.length-1].cum:0;
  const sug=r2(total-recorded);
  const rows=plan.map(x=>`<div><span>${ordName(x.n)}${x.p.label?' · <small>'+esc(x.p.label)+'</small>':''} ${x.p.paid?pill('ok','مدفوعة '+fmtD(x.p.paidDate)):pill(dueKind(x.p.dueDate),'مجدولة '+fmtD(x.p.dueDate))}</span><b>${money(x.p.amount,o.currency)}</b></div>`).join('');
  const sugLabel=editing?'الباقي المقترح لهذه الدفعة':'الباقي المقترح للدفعة '+(ORD[plan.length]||'التالية');
  const html=`<div><span>إجمالي الطلب</span><b>${money(total,o.currency)}</b></div>`
    +(rows||'<div><small>لا توجد دفعات سابقة لهذا الطلب. هذه ستكون الدفعة الأولى.</small></div>')
    +(plan.length?`<div class="sum"><span>مجموع الدفعات المسجّلة</span><b>${money(recorded,o.currency)}</b></div>`:'')
    +(total?`<div class="sug ${sug<=0.005?'zero':''}"><span>${sug>0.005?sugLabel:'الطلب مغطّى بالكامل بالدفعات المسجّلة'}</span><span>${sug>0.005?money(sug,o.currency)+' <button type="button" class="btn sm" data-act="use-suggest">استخدم</button>':''}</span></div>`:'<div><small>اكتب إجمالي الطلب أولاً حتى يُحسب الباقي.</small></div>');
  return {sug,html};
}

function shipmentForm(s0,orderId,back){
  if(!S.carriers.length){ensureCarrier().then(ok=>{if(ok)shipmentForm(s0,orderId,back)});return}
  const e=s0||{orderId:orderId||'',status:'preparing',currency:'CNY'};
  WS={kind:'ship',car:e.carrierId&&byId('carriers',e.carrierId)?e.carrierId:((WCAR&&byId('carriers',WCAR))?WCAR:S.carriers[0].id),ord:e.orderId||null,cur:e.currency||'CNY',st:e.status||'preparing'};
  const seg=(k,opts,v,act)=>`<div class="chips" role="group">${opts.map(o=>`<button type="button" class="chip" data-act="${act||'w-seg'}" data-k="${k}" data-v="${o[0]}" aria-pressed="${o[0]===v}">${o[1]}</button>`).join('')}</div>`;
  const body=`${wCarPick()}
    <div class="fld"><span>الطلب</span>${comboHTML('cbOrd',true)}</div>
    <div class="grid2">${fld('أجور الشحن',inp('cost',e.cost||'','number','inputmode="decimal"'))}<div class="fld"><span>العملة</span>${seg('cur',[['CNY','يوان ¥'],['USD','دولار $']],WS.cur)}</div></div>
    <div class="fld"><span>الحالة</span>${seg('st',SHIP_ST,WS.st,'sh-st')}</div>
    ${fld('تاريخ المغادرة',inp('departDate',e.departDate||todayISO(),'date'))}
    ${durField('eta','يوصل بعد',e.eta)}
    <details class="more"${e.ref||e.note?' open':''}><summary>رقم البوليصة وملاحظات (اختياري)</summary>${fld('رقم الشحنة / البوليصة',inp('ref',e.ref||'','text','placeholder="إذا فارغ يتسوّى رقم تلقائي"'))}${fld('ملاحظات',ta('note',e.note))}</details>
    <p class="hint">أجور الشحن تنخصم تلقائياً من رصيدك عند شركة الشحن.</p>`;
  openModal(s0?'تعديل شحنة':'شحنة جديدة',body,{back,del:s0?['shipments',s0.id]:null,
    onOpen:f=>{comboPaint('cbOrd');initDur(f,['eta']);f.addEventListener('input',ev=>{if(ev.target.classList.contains('cb-q'))comboList(ev.target.closest('.combo').id)})},
    onSubmit:async f=>{
      const carrierId=WS.car;if(!byId('carriers',carrierId)){ferr('اختر شركة الشحن');return}
      const cost=r2(num2(f.elements.cost.value));if(cost<0){ferr('المبلغ لا يمكن أن يكون سالب','cost');return}
      const dd=val(f,'departDate'),eta=val(f,'eta');
      if(dd&&eta&&eta<dd){ferr('موعد الوصول لا يمكن أن يسبق تاريخ المغادرة','eta');return}
      let ref=val(f,'ref');
      if(ref&&S.shipments.some(x=>x.id!==e.id&&x.carrierId===carrierId&&norm(x.ref)===norm(ref))){ferr('توجد شحنة بنفس الرقم لدى شركة الشحن هذه.','ref');return}
      if(!ref){const o=WS.ord&&byId('orders',WS.ord);const base='ش-'+(o&&o.ref?o.ref:(dd||todayISO()).slice(5).replace('-',''));let k=1,r=base;while(S.shipments.some(x=>x.id!==e.id&&norm(x.ref)===norm(r)))r=base+'-'+(++k);ref=r}
      const paidAmount=Math.min(+e.paidAmount||0,cost);
      await put('shipments',Object.assign({},e,{id:e.id||newId('shipments'),createdAt:e.createdAt||Date.now(),ref,carrierId,orderId:WS.ord||'',cost,currency:WS.cur,paidAmount,status:WS.st,departDate:dd,eta,note:val(f,'note')}));
      WCAR=carrierId;closeModal();toast('تم حفظ الشحنة');autoXlsx()}});
}
function askDelete(col,id){
  const back=M.back;let label='',warn='';
  if(col==='orders'){const o=byId('orders',id);if(!o)return;label='الطلب '+o.ref;
    const viaP=S.payments.filter(p=>p.orderId===id&&p.paid&&p.via&&byId('carriers',p.via));
    if(viaP.length){openModal('لا يمكن الحذف','<p>الطلب <b>'+esc(o.ref)+'</b> عليه '+viaP.length+' دفعة دفعتها شركة الشحن من رصيدك. إذا ينحذف الطلب، هاي المبالغ ترجع لرصيدك وكأنها ما انصرفت.</p><p style="color:var(--mute)">إذا فعلاً تريد تحذفه، احذف دفعاته أول من داخل الطلب.</p><div class="mf"><button type="button" class="btn" data-act="close">حسناً</button></div>',{back});return}
    const np=S.payments.filter(p=>p.orderId===id).length,ns=S.shipments.filter(s=>s.orderId===id).length;
    warn=(np?'ستُحذف '+np+' دفعة مسجّلة عليه. ':'')+(ns?'وتبقى '+ns+' شحنة بدون ربط بالطلب.':'')}
  else if(col==='payments'){const p=byId('payments',id);if(!p)return;const o=byId('orders',p.orderId);label='الدفعة '+num(p.amount)+' '+(CUR[o&&o.currency]||'')+(p.label?' ('+p.label+')':'');
    const vc=p.paid&&p.via&&byId('carriers',p.via);if(vc)warn='هاي الدفعة دفعتها '+vc.name+'. بعد الحذف رصيدك عندهم يرجع يزيد '+num(p.amount)+' '+(CUR[o&&o.currency]||'')+'.'}
  else if(col==='shipments'){const s=byId('shipments',id);if(!s)return;label='الشحنة '+s.ref}
  else if(col==='factories'){const f=byId('factories',id);if(!f)return;label='المصنع '+f.name;
    const n=S.orders.filter(o=>o.factoryId===id).length;
    if(n){openModal('لا يمكن الحذف','<p>المصنع <b>'+esc(f.name)+'</b> عليه '+n+' طلب. احذف طلباته أو انقلها أولاً حتى لا تضيع سجلاتك.</p><div class="mf"><button type="button" class="btn" data-act="close">حسناً</button></div>',{back});return}}
  else if(col==='ledger'){const l=byId('ledger',id);if(!l)return;label=labelOf('ledger',l)}
  else if(col==='ctx'){const l=byId('ctx',id);if(!l)return;label=labelOf('ctx',l)}
  else if(col==='companies'){const c=S.companies.find(x=>x.id===id);if(!c)return;label='الشركة '+c.name;
    const n=SCOPED.reduce((a,k)=>a+RAW[k].filter(d=>cid(d)===id).length,0);
    if(n||id===DEFAULT_CO){openModal('لا يمكن الحذف','<p>الشركة <b>'+esc(c.name)+'</b> فيها '+n+' سجل. لا تُحذف شركة عليها سجلات حتى لا تضيع بياناتك.</p><div class="mf"><button type="button" class="btn" data-act="close">حسناً</button></div>',{back});return}}
  else if(col==='carriers'){const c=byId('carriers',id);if(!c)return;label='شركة الشحن '+c.name;
    const n=S.shipments.filter(s=>s.carrierId===id).length+S.ctx.filter(x=>x.carrierId===id).length+S.payments.filter(p=>p.via===id).length;
    if(n){openModal('لا يمكن الحذف','<p>شركة الشحن <b>'+esc(c.name)+'</b> عليها '+n+' حركة (فلوس، دفعات أو شحنات). ما تنحذف حتى ما يضيع كشف حسابها.</p><div class="mf"><button type="button" class="btn" data-act="close">حسناً</button></div>',{back});return}}
  openModal('تأكيد الحذف',`<p>سيتم حذف <b>${esc(label)}</b> نهائياً ولا يمكن التراجع.${warn?'<br>'+esc(warn):''}</p><div class="mf"><button type="button" class="btn ghost" data-act="close">تراجع</button><button type="button" class="btn danger" data-act="del-ok" data-col="${col}" data-id="${id}">حذف نهائياً</button></div>`,{back});
}
async function doDelete(col,id){
  try{
    if(col==='orders'){
      const np=S.payments.filter(p=>p.orderId===id).length;
      const lbl=labelOf('orders',byId('orders',id))+(np?' (مع '+np+' دفعة)':'');
      for(const p of S.payments.filter(p=>p.orderId===id))await remove('payments',p.id,{quiet:true});
      for(const s of S.shipments.filter(s=>s.orderId===id))await put('shipments',Object.assign({},s,{orderId:''}),{quiet:true});
      const od=byId('orders',id);
      for(const f of ((od&&od.files)||[]))try{await dropFile(f.id)}catch(e){}
      await remove(col,id,{label:lbl});
    }else{if(col==='ctx'){const cx=byId('ctx',id);for(const f of ((cx&&cx.files)||[]))try{await dropFile(f.id)}catch(e){}}
      await remove(col,id,col==='companies'?{label:'الشركة '+coName(id)}:undefined)}
    if(col==='companies'&&ACTIVE===id)switchCompany(DEFAULT_CO);
    if(col==='orders'||col==='factories'||col==='carriers')M.back=null;
    closeModal();toast('تم الحذف');
  }catch(e){}
}

const NEXT={production:['ready','تحديد كجاهز للشحن'],ready:['shipped','تحديد كمشحون'],shipped:['received','تحديد كمستلم']};
function openOrder(id){
  const draw=()=>{
    const o=byId('orders',id);if(!o){closeModal(true);return ''}
    const i=oi(o);
    const items=(o.items||[]).map(x=>`<tr><td data-label="المنتج">${esc(x.name)}</td><td class="n" data-label="الكمية">${num(x.qty)}</td><td class="n" data-label="السعر">${money(x.price,o.currency)}</td><td class="n" data-label="الإجمالي">${money(x.qty*x.price,o.currency)}</td></tr>`).join('');
    const plan=payPlan(o);
    const pays=plan.map(x=>{const p=x.p;return `<li><div class="t"><b>${ordName(x.n)} · ${money(p.amount,o.currency)}${p.label?' <small>('+esc(p.label)+')</small>':''}</b><small>${p.paid?'سُدّدت '+fmtD(p.paidDate):'تستحق '+fmtD(p.dueDate)}${p.method?' · '+esc(p.method):''} · يتبقى بعدها ${money(Math.max(x.after,0),o.currency)}</small></div><div class="r">${p.paid?pill('ok','مدفوعة'):pill(dueKind(p.dueDate),dueText(p.dueDate))}
      ${p.paid?'':`<button class="btn sm" data-act="pay-now" data-id="${p.id}">تسديد</button>`}<button class="icon" data-act="edit-payment" data-id="${p.id}" aria-label="تعديل">${ico('edit',16)}</button></div></li>`}).join('');
    const pp=i.total?Math.min(100,i.paid/i.total*100):0,ps=i.total?Math.min(100-pp,i.scheduled/i.total*100):0;
    const ships=S.shipments.filter(s=>s.orderId===id).map(s=>`<li><div class="t"><b>${esc(s.ref)}</b><small>${esc((byId('carriers',s.carrierId)||{}).name||'—')} · وصول ${fmtD(s.eta)}</small></div><div class="r">${pill(SHIP_K[s.status],shipName(s.status))} <button class="icon" data-act="edit-shipment" data-id="${s.id}" aria-label="تعديل">${ico('edit',16)}</button></div></li>`).join('');
    return `<div class="bar">${pill(STAGE_K[o.stage],stageName(o.stage))}${i.timing?pill(i.timing.k,'التجهيز: '+i.timing.t):''}${i.recv?pill(i.recv.k,'الاستلام: '+i.recv.t):''}${pill(i.pay[0],'الدفع: '+i.pay[1])}<span style="color:var(--mute)">${esc(factoryName(o.factoryId))} · ${fmtD(o.orderDate)}</span></div>
    <div class="kv"><div><small>الإجمالي</small><b>${money(i.total,o.currency)}</b></div><div><small>المدفوع</small><b>${money(i.paid,o.currency)}</b></div><div><small>المتبقي للمصنع</small><b>${money(i.remaining,o.currency)}</b></div><div><small>مجدول غير مدفوع</small><b>${money(i.scheduled,o.currency)}</b></div><div><small>موعد التجهيز</small><b>${fmtD(o.prepDate)}</b></div>${o.recvDate?`<div><small>موعد الاستلام</small><b>${fmtD(o.recvDate)}</b></div>`:''}</div>
    <div><div class="prog" role="img" aria-label="نسبة المدفوع ${Math.round(pp)} بالمئة"><i class="p1" style="width:${pp}%"></i><i class="p2" style="width:${ps}%"></i></div><div class="legend" style="margin-top:6px"><span><b style="background:var(--ok)"></b>مدفوع <bdi>${Math.round(pp)}%</bdi></span><span><b style="background:var(--warn)"></b>مجدول <bdi>${Math.round(ps)}%</bdi></span><span><b style="background:var(--glass-2)"></b>غير مجدول</span></div></div>
    ${items?`<div class="scroll"><table class="tbl"><thead><tr><th>المنتج</th><th class="n">الكمية</th><th class="n">السعر</th><th class="n">الإجمالي</th></tr></thead><tbody>${items}</tbody></table></div>`:''}
    <div><h3 style="margin-bottom:6px">الدفعات <span class="acts"><button class="btn ghost sm" data-act="sched-pay" data-order="${id}">${ico('clock',14)} موعد دفعة</button><button class="btn sm" data-act="pay-order" data-order="${id}">${ico('plus',14)} دفع الآن</button></span></h3><ul class="list">${pays||'<li style="color:var(--mute)">لا توجد دفعات مسجّلة</li>'}</ul></div>
    <div><h3 style="margin-bottom:6px">الشحنات <button class="btn ghost sm" data-act="new-shipment" data-order="${id}">${ico('plus',14)} شحنة</button></h3><ul class="list">${ships||'<li style="color:var(--mute)">لا توجد شحنات مرتبطة</li>'}</ul></div>
    ${attSection(o)}
    ${o.note?`<div class="hint">${esc(o.note)}</div>`:''}
    <div class="mf"><button class="btn ghost" type="button" data-act="del-ask" data-col="orders" data-id="${id}">${ico('trash',16)} حذف</button>${NEXT[o.stage]?`<button class="btn ghost" type="button" data-act="next-stage" data-id="${id}">${ico('check',16)} ${NEXT[o.stage][1]}</button>`:''}<button class="btn" type="button" data-act="edit-order" data-id="${id}">${ico('edit',16)} تعديل الطلب</button></div>`;
  };
  const mount=()=>{
    const o=byId('orders',id);if(!o)return;
    openModal('طلب '+(o.ref||''),draw(),{wide:true,refresh:()=>{const f=$('#mform');if(f){const h=draw();if(h)f.innerHTML=h}}});
  };
  mount();
}

/* ---------- views ---------- */
const FL={orders:{q:'',st:''},payments:{q:'',st:''},shipments:{q:'',st:''}};
const toolbar=(key,opts)=>`<div class="bar card" style="padding:12px"><div class="grow field-s"><input id="q_${key}" type="search" placeholder="بحث سريع…" value="${esc(FL[key].q)}" aria-label="بحث"></div><select id="s_${key}" aria-label="تصفية" style="max-width:200px">${opts.map(o=>`<option value="${o[0]}"${FL[key].st===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div><div class="card scroll" id="list"></div>`;
const empty=(t,s,cta)=>`<div class="empty"><b>${t}</b><span>${s}</span>${cta||''}</div>`;

function ordersList(){
  const q=FL.orders.q.trim().toLowerCase(),st=FL.orders.st;
  let rows=S.orders.map(o=>({o,i:oi(o)})).filter(r=>{
    if(st==='open'&&r.o.stage==='received')return false;
    if(st==='late'&&!(r.i.timing&&r.i.timing.k==='bad'))return false;
    if(st==='recv'&&!(r.i.recv&&r.i.recv.k!=='ok'))return false;
    if(st==='unpaid'&&r.i.remaining<=0.001)return false;
    if(['production','ready','shipped','received'].includes(st)&&r.o.stage!==st)return false;
    if(q){const hay=(r.o.ref+' '+factoryName(r.o.factoryId)+' '+(r.o.note||'')+' '+(r.o.items||[]).map(x=>x.name).join(' ')).toLowerCase();if(!hay.includes(q))return false}
    return true}).sort((a,b)=>(b.o.orderDate||'').localeCompare(a.o.orderDate||''));
  if(!S.orders.length)return empty('لا توجد طلبات بعد','سجّل أول طلب مع المصنع ومبلغه ومواعيده.',`<button class="btn" data-act="new-order">${ico('plus')} طلب جديد</button>`);
  if(!rows.length)return empty('لا نتائج','غيّر البحث أو التصفية.');
  return `<div class="ocards">${rows.map(r=>{const t=r.i.total,pp=t?Math.min(100,r.i.paid/t*100):0,ps=t?Math.min(100-pp,r.i.scheduled/t*100):0,done=t&&r.i.remaining<=0.001;
    const nf=(r.o.files||[]).length;
    return `<button type="button" class="ocard${done?' done':''}" data-act="open-order" data-id="${r.o.id}">
     <div class="oc-h"><div class="oc-t"><b>${esc(r.o.ref||'بدون رقم')}</b><small>${esc(factoryName(r.o.factoryId))} · ${fmtD(r.o.orderDate)}${nf?' · 📎 '+nf:''}</small></div>${pill(STAGE_K[r.o.stage],stageName(r.o.stage))}</div>
     <div class="oc-m"><div><small>${done?'مدفوع بالكامل':t?'المتبقي للمصنع':'بدون مبلغ'}</small><b class="${done?'ok':''}">${t?money(done?t:r.i.remaining,r.o.currency):'—'}</b></div>${pill(r.i.pay[0],r.i.pay[1])}</div>
     <div class="zbar oc-bar" role="img" aria-label="مدفوع ${Math.round(pp)} بالمئة"><i class="p" style="width:${pp}%"></i><i class="s" style="width:${ps}%"></i></div>
     <div class="oc-f"><span>الإجمالي <b>${t?money(t,r.o.currency):'—'}</b></span><span>مدفوع <b>${money(r.i.paid,r.o.currency)}</b></span>${r.i.scheduled?`<span>مجدول <b>${money(r.i.scheduled,r.o.currency)}</b></span>`:''}${r.o.prepDate&&r.o.stage==='production'?`<span>التجهيز ${r.i.timing&&r.i.timing.k!=='ok'?pill(r.i.timing.k,r.i.timing.t):'<b>'+fmtD(r.o.prepDate)+'</b>'}</span>`:''}</div>
    </button>`}).join('')}</div>`;
}
function payStatus(p){
  if(p.paid)return ['ok','مدفوعة'];
  if(!p.dueDate)return ['mute','بدون موعد'];
  const d=diffDays(p.dueDate);return d<0?['bad','متأخرة']:d<=7?['warn','قريبة']:['info','مجدولة'];
}
function paymentsList(){
  const q=FL.payments.q.trim().toLowerCase(),st=FL.payments.st;
  const planOf={};S.orders.forEach(o=>{planOf[o.id]=payPlan(o)});
  const info=p=>{const pl=planOf[p.orderId]||[];return pl.find(x=>x.p.id===p.id)||{n:1,after:0,cum:0}};
  const all=S.payments.map(p=>({p,o:byId('orders',p.orderId),s:payStatus(p),x:info(p),cnt:(planOf[p.orderId]||[]).length}));
  let rows=all.filter(r=>{
    if(st==='unpaid'&&r.p.paid)return false;
    if(st==='paid'&&!r.p.paid)return false;
    if(st==='late'&&r.s[1]!=='متأخرة')return false;
    if(st==='soon'&&r.s[1]!=='قريبة')return false;
    if(q){const hay=((r.p.label||'')+' '+orderLabel(r.o)+' '+(r.p.note||'')).toLowerCase();if(!hay.includes(q))return false}
    return true}).sort((a,b)=>(a.p.paid-b.p.paid)||(a.p.paid?(b.p.paidDate||'').localeCompare(a.p.paidDate||''):(a.p.dueDate||'9').localeCompare(b.p.dueDate||'9')));
  if(!S.payments.length)return empty('لا توجد دفعات','سجّل الدفعات المجدولة والمسدّدة لكل طلب.',`<button class="btn" data-act="new-payment">${ico('plus')} دفعة جديدة</button>`);
  const sPaid={},sSched={},sLate={};
  all.forEach(r=>{const c=r.o&&r.o.currency,a=+r.p.amount||0;if(r.p.paid)addTo(sPaid,c,a);else{addTo(sSched,c,a);if(r.s[1]==='متأخرة')addTo(sLate,c,a)}});
  const sum=`<div class="kv" style="margin-bottom:12px"><div><small>مدفوع إجمالاً</small><b>${multi(sPaid)}</b></div><div><small>مجدول غير مدفوع</small><b>${multi(sSched)}</b></div><div><small>متأخر</small><b style="color:${Object.keys(sLate).some(c=>sLate[c]>0)?'var(--bad)':'inherit'}">${multi(sLate)}</b></div></div>`;
  if(!rows.length)return sum+empty('لا نتائج','غيّر البحث أو التصفية.');

async function saveFile(filename,data){
  try{

    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();

  }catch(e){toast('تعذر حفظ الملف','bad');return false}
}

function restoreFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let j;try{j=JSON.parse(r.result)}catch(e){toast('الملف غير صالح','bad');return}
    if(!j||j.app!=='trade-system'||!j.data||typeof j.data!=='object'){toast('هذا ليس ملف نسخة احتياطية لهذا النظام','bad');return}
    const okId=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
    const clean={};let skipped=0;
    const KEYS=[...COLS,'ledger','ctx','companies','files'];
    KEYS.forEach(c=>{clean[c]=[];(Array.isArray(j.data[c])?j.data[c]:[]).forEach(d=>{if(d&&typeof d==='object'&&!Array.isArray(d)&&okId.test(String(d.id||'')))clean[c].push(d);else skipped++})});
    const names={factories:'مصانع',orders:'طلبات',payments:'دفعات',carriers:'شركات شحن',shipments:'شحنات',ledger:'حركات حساب',ctx:'حركات شركات الشحن',companies:'شركات',files:'مرفقات'};
    openModal('استعادة نسخة',`<p>ستتم إضافة السجلات التالية. السجل المطابق بنفس المعرّف يُستبدل بما في النسخة.</p><ul class="list">${KEYS.filter(c=>clean[c].length||COLS.includes(c)).map(c=>`<li><span>${names[c]}</span><b>${clean[c].length}</b></li>`).join('')}</ul>${skipped?`<div class="hint bad">سيتم تجاهل ${skipped} سجل غير صالح.</div>`:''}`,{submitText:'استعادة',onSubmit:async()=>{
      try{let n=0;for(const c of KEYS)for(const d of clean[c]){if(c==='files'){if(d.data)await writeFileDoc(d.id,d)}else await put(c,d,{quiet:true});n++}logAct('restore','','استعادة '+n+' سجل من نسخة احتياطية');closeModal(true);toast('تمت الاستعادة')}catch(e){}}});
  };
  r.readAsText(file);
}

/* ---------- db layer over Supabase (same API the app already uses) ---------- */
function makeDb(sb){
  const gid=()=>{const a=new Uint8Array(15);crypto.getRandomValues(a);return Array.from(a,b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('')};
  const stores={},listeners={};
  const st=col=>stores[col]||(stores[col]=new Map());
  const emit=col=>(listeners[col]||[]).forEach(f=>f());
  let chan=null;
  function ensureChannel(){
    if(chan)return;
    chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const row=p.new&&p.new.col?p.new:p.old;if(!row||!row.col)return;
      const m=st(row.col);
      if(p.eventType==='DELETE')m.delete(row.id);else m.set(row.id,p.new.data);
      emit(row.col);
    }).subscribe(status=>{if(status==='SUBSCRIBED')Object.keys(listeners).forEach(c=>fetchCol(c))});
  }
  async function fetchCol(col,errcb){
    const {data,error}=await sb.from('docs').select('id,data').eq('col',col).limit(5000);
    if(error){if(errcb)errcb(error);return}
    const m=st(col);m.clear();data.forEach(r=>m.set(r.id,r.data));emit(col);
  }
  const write=async(col,id,d)=>{
    const {error}=await sb.from('docs').upsert({col,id,data:d,updated_at:new Date().toISOString()},{onConflict:'col,id'});
    if(error)throw error;st(col).set(id,d);emit(col);
  };
  const del=async(col,id)=>{
    const {error,count}=await sb.from('docs').delete({count:'exact'}).eq('col',col).eq('id',id);
    if(error)throw error;if(count===0)throw new Error('not_allowed');st(col).delete(id);emit(col);
  };
  function collection(col,opt){
    opt=opt||{};
    return {
      doc(id){id=id||gid();return {id,set:d=>write(col,id,d),delete:()=>del(col,id),get:async()=>{const {data,error}=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data?data.data:undefined}}}},
      add:async d=>{const id=gid();await write(col,id,d);return {id}},
      orderBy(f,dir){return collection(col,Object.assign({},opt,{ob:f,dir:dir||'asc'}))},
      limit(n){return collection(col,Object.assign({},opt,{lim:n}))},
      onSnapshot(cb,errcb){
        const fire=()=>{
          let rows=[...st(col).entries()].map(([id,data])=>({id,data}));
          if(opt.ob){rows.sort((a,b)=>{const x=a.data[opt.ob],y=b.data[opt.ob];return (x>y?1:x<y?-1:0)*(opt.dir==='desc'?-1:1)})}
          if(opt.lim)rows=rows.slice(0,opt.lim);
          cb({docs:rows.map(r=>({id:r.id,data:()=>r.data}))});
        };
        (listeners[col]=listeners[col]||[]).push(fire);
        ensureChannel();
        fetchCol(col,errcb);
        return ()=>{listeners[col]=listeners[col].filter(f=>f!==fire)};
      }
    };
  }
  return {
    collection:c=>collection(c),
    doc(path){
      const [col,id]=path.split('/');
      return {
        set:d=>write(col,id,d),
        onSnapshot(cb,errcb){
          const fire=()=>{const d=st(col).get(id);cb({exists:d!==undefined,data:()=>d})};
          (listeners[col]=listeners[col]||[]).push(fire);ensureChannel();fetchCol(col,errcb);
          return ()=>{listeners[col]=listeners[col].filter(f=>f!==fire)};
        }
      };
    }
  };
}

/* ---------- auth + boot ---------- */
function showAuth(mode,msg){
  const a=$('#auth');a.hidden=false;
  const head='<h1>الطلبات والشحن</h1>';
  if(mode==='setup'){a.innerHTML=`<div class="box">${head}<p>لم يتم ربط الموقع بقاعدة البيانات بعد. افتح ملف config.js وضع عنوان المشروع والمفتاح العام (انظر ملف التعليمات).</p></div>`;return}
  if(mode==='pending'){a.innerHTML=`<div class="box">${head}<p>تم تسجيل دخولك، لكن حسابك لم يُفعَّل بعد. اطلب من المدير تفعيله ثم أعد تحميل الصفحة.</p><button class="btn" id="authOut" type="button">تسجيل الخروج</button></div>`;$('#authOut').onclick=logout;return}
  a.innerHTML=`<form class="box" id="authForm" novalidate>${head}<p>اكتب رمز الدخول</p>
    <label>الرمز<input id="aPin" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required></label>
    <label class="rem"><input id="aRem" type="checkbox" checked>تذكّرني على هذا الجهاز</label>
    <p class="err" id="aErr" role="alert">${esc(msg||'')}</p>
    <button class="btn" id="aGo" type="submit">دخول</button></form>`;
  setTimeout(()=>{const i=$('#aPin');i&&i.focus()},50);
  try{fetch(window.APP_CONFIG.url+'/functions/v1/pin-login',{method:'OPTIONS'}).catch(()=>{})}catch(e){}
  $('#authForm').onsubmit=async ev=>{
    ev.preventDefault();const pin=$('#aPin').value.trim().replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x660).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x6F0);
    if(!pin){$('#aErr').textContent='اكتب الرمز';return}
    const b=$('#aGo');b.disabled=true;b.textContent='جارٍ الدخول…';
    try{
      const cfg=window.APP_CONFIG;
      const r=await fetch(cfg.url+'/functions/v1/pin-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.anonKey,Authorization:'Bearer '+cfg.anonKey},body:JSON.stringify({pin})});
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.access_token){setRemember($('#aRem').checked);const {data,error}=await SB.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(error)throw error;enter(data.user);return}
      $('#aErr').textContent=r.status===429?('محاولات كثيرة. جرّب بعد '+(d.retry_min||15)+' دقيقة'):'الرمز غير صحيح';
    }catch(e){$('#aErr').textContent='تعذر الاتصال. تحقق من الإنترنت'}
    b.disabled=false;b.textContent='دخول';
  };
}
const AUTH_KEY='azawi-shope-auth',REM_KEY='azawi-shope-rem',PROF_KEY='azawi-shope-prof';
function remembered(){try{return localStorage.getItem(REM_KEY)!=='0'}catch(e){return true}}
function setRemember(on){try{localStorage.setItem(REM_KEY,on?'1':'0');if(!on)localStorage.removeItem(AUTH_KEY);else sessionStorage.removeItem(AUTH_KEY)}catch(e){}}
const authStore={getItem:k=>{try{return (remembered()?localStorage:sessionStorage).getItem(k)}catch(e){return null}},
  setItem:(k,v)=>{try{(remembered()?localStorage:sessionStorage).setItem(k,v)}catch(e){}},
  removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}};
function cachedProf(uid){try{const p=JSON.parse(localStorage.getItem(PROF_KEY)||'null');return p&&p.uid===uid?p:null}catch(e){return null}}
function startApp(user,role,co,lang){ME={id:user.id,email:'',role};LOCK_CO=role==='staff'&&co?co:null;document.body.classList.toggle('lockco',!!LOCK_CO);if(lang==='zh'&&window.zhOn)zhOn();$('#auth').hidden=true;SBDB=makeDb(SB);init()}
async function fetchMyProf(user){
  const [mine,all]=await Promise.all([SB.from('profiles').select('*').eq('user_id',user.id).maybeSingle(),SB.from('profiles').select('*')]);
  PROFILES={};(all.data||[]).forEach(p=>PROFILES[p.user_id]=p);
  if(mine.error)throw mine.error;return mine.data;
}
async function enter(user){
  const c=cachedProf(user.id);
  if(c&&(c.role==='admin'||c.role==='staff')){
    startApp(user,c.role,c.co,c.lang);
    fetchMyProf(user).then(prof=>{const r=prof&&prof.role;
      if(!r||r==='pending'){try{localStorage.removeItem(PROF_KEY)}catch(e){}logout();return}
      if(r!==c.role||(prof.company||null)!==(c.co||null)||(prof.lang||null)!==(c.lang||null)){try{localStorage.setItem(PROF_KEY,JSON.stringify({uid:user.id,role:r,co:prof.company||null,lang:prof.lang||null}))}catch(e){}location.reload();return}
      if(false){try{localStorage.setItem(PROF_KEY,JSON.stringify({uid:user.id,role:r}))}catch(e){}location.reload()}
    }).catch(()=>{});
    return;
  }
  let prof=null;try{prof=await fetchMyProf(user)}catch(e){showAuth('login','تعذر الاتصال. تحقق من الإنترنت');return}
  if(!prof||prof.role==='pending'||!prof.role){showAuth('pending');return}
  try{localStorage.setItem(PROF_KEY,JSON.stringify({uid:user.id,role:prof.role,co:prof.company||null,lang:prof.lang||null}))}catch(e){}
  startApp(user,prof.role,prof.company,prof.lang);
}
async function logout(){try{localStorage.removeItem(PROF_KEY)}catch(e){}try{await SB.auth.signOut()}catch(e){}authStore.removeItem(AUTH_KEY);location.reload()}
async function boot(){
  const cfg=window.APP_CONFIG||{};
  if(!cfg.url||!cfg.anonKey||!window.supabase){showAuth('setup');return}
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:AUTH_KEY,storage:authStore}});
  try{const old='sb-'+new URL(cfg.url).hostname.split('.')[0]+'-auth-token';if(!localStorage.getItem(AUTH_KEY)&&localStorage.getItem(old)){localStorage.setItem(AUTH_KEY,localStorage.getItem(old));localStorage.removeItem(old)}}catch(e){}
  let sess=null;
  try{const {data}=await SB.auth.getSession();sess=data&&data.session}catch(e){}
  if(!sess){showAuth('login');return}
  enter(sess.user);
}
render();
boot();
</script>

const AR='؀-ۿ';
const keys=Object.keys(T).filter(k=>k.trim().length>1||k==='و').sort((a,b)=>b.length-a.length);
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const RX=new RegExp('(^|[^'+AR+'])('+keys.map(k=>esc(k.trim())).join('|')+')(?=$|[^'+AR+'])','g');
const MAP={};keys.forEach(k=>MAP[k.trim()]=T[k]);
const pl='(يومان|يوم(?![\u0600-\u06FF])|(\\d+) (?:أيام|يوماً))';
const nd=(a,n)=>a==='يوم'?1:a==='يومان'?2:n;
const PAT=[
 [new RegExp('(?:متأخرة|متأخر) '+pl,'g'),(m,a,n)=>'逾期'+nd(a,n)+'天'],
 [new RegExp('بعد '+pl+' من اليوم','g'),(m,a,n)=>nd(a,n)+'天后'],
 [new RegExp('بعد '+pl,'g'),(m,a,n)=>nd(a,n)+'天后'],
 [new RegExp('صارلها '+pl,'g'),(m,a,n)=>'已'+nd(a,n)+'天'],
 [new RegExp('مضى '+pl,'g'),(m,a,n)=>nd(a,n)+'天前'],
 [/(\d+) (?:أيام|يوماً)/g,(m,n)=>n+'天'],
 [/(\d+) أشهر/g,(m,n)=>n+'个月'],
];
function tr(s){
  if(!s||!/[؀-ۿ]/.test(s))return s;
  let o=s;for(const [r,f] of PAT)o=o.replace(r,f);
  o=o.replace(RX,(m,pre,w)=>pre+(MAP[w]||w));
  return o.replace(/،/g,'，').replace(/؟/g,'？').replace(/«/g,'「').replace(/»/g,'」').replace(/ · /g,' · ');
}
window.zhTr=tr;
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA']);
function walk(root){
  if(root.nodeType===3){const p=root.parentNode;if(p&&!SKIP.has(p.nodeName)){const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}return}
  if(root.nodeType!==1||SKIP.has(root.nodeName))return;
  for(const a of ['placeholder','aria-label','title']){const v=root.getAttribute&&root.getAttribute(a);if(v){const t=tr(v);if(t!==v)root.setAttribute(a,t)}}
  if(root.nodeName==='OPTION'){const t=tr(root.textContent);if(t!==root.textContent)root.textContent=t;return}
  for(let c=root.firstChild;c;c=c.nextSibling)walk(c);
}
let obs=null;
window.zhOn=function(){
  document.documentElement.lang='zh-CN';document.documentElement.dir='ltr';document.querySelectorAll('[dir="rtl"]').forEach(e=>{e.dir='ltr';e.lang='zh-CN'});document.documentElement.classList.add('zh');
  document.title=tr(document.title);
  walk(document.body);
  if(obs)return;
  obs=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')walk(m.target);else if(m.type==='attributes')walk(m.target);else m.addedNodes.forEach(walk)}});
  obs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
};
})();
